name: Release

on:
  push:
    tags:
      - '[0-9]*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      # The engine WASM (src/wasm/omd2typst-pkg/) is committed, so the release is
      # built straight from the repo with the locked dependency versions — the
      # same inputs the community-store build verification uses. Do not rebuild
      # the WASM here: a different Rust/wasm-pack version yields different bytes
      # and the released main.js would no longer match a clean build.
      - run: npm ci
      - run: npm run build

      - name: Package examples
        run: zip -r omd2typst-examples.zip input/ templates/ -x "**/.DS_Store"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            omd2typst-examples.zip

      - name: Extract release notes
        run: |
          python3 - <<'PYEOF' > notes.md
          import re
          tag = "${{ github.ref_name }}".lstrip('v')
          content = open('RELEASE_NOTES.md').read()
          pattern = rf'## v?{re.escape(tag)} .+?\n(.*?)(?=\n---|\n## |\Z)'
          match = re.search(pattern, content, re.DOTALL)
          print(match.group(1).strip() if match else '')
          PYEOF

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view ${{ github.ref_name }} --repo ${{ github.repository }} > /dev/null 2>&1; then
            gh release create ${{ github.ref_name }} \
              --repo ${{ github.repository }} \
              --title "${{ github.ref_name }}" \
              --notes-file notes.md
          fi

          gh release upload ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --clobber \
            main.js \
            manifest.json \
            omd2typst-examples.zip
